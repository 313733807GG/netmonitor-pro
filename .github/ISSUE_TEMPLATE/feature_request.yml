name: Feature request
description: Suggest an improvement for NetMonitor Pro
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前使用上的困难或限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望看到的交互、数据或行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选，说明你考虑过的其它做法。
