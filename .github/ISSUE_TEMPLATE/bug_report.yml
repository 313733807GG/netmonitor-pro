name: Bug report
description: Report a reproducible problem in NetMonitor Pro
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交代理订阅、控制器 Token、节点名称、IP 地址、完整流量账本或其它敏感信息。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请简洁说明实际发生的情况与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动程序
        2. …
        3. 观察到 …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: |
        NetMonitor 版本：
        Windows 版本：
        是否管理员模式：
        代理内核类型与版本：
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 请先删除订阅、Token、IP、域名和个人流量数据。
